services:
  - type: web
    name: voice-task-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
